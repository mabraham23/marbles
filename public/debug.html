<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Marbles — Debug</title>
    <link rel="stylesheet" href="styles.css?v=5" />
  </head>
  <body class="debug-body">
    <main class="app-shell debug-shell">
      <header class="debug-topbar">
        <h1>Marbles Debug</h1>
        <p class="subtitle">Local sandbox — no server, no rooms. Drive every turn from one screen.</p>
      </header>

      <div id="errorBanner" class="error-banner" hidden></div>

      <!-- SETUP PHASE -->
      <section id="debugSetup" class="card debug-setup">
        <h2>New game</h2>
        <div class="debug-setup-row">
          <label>
            Players
            <select id="dbgPlayerCount">
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4" selected>4</option>
              <option value="5">5</option>
              <option value="6">6</option>
            </select>
          </label>
          <label>
            Mode
            <select id="dbgMode"></select>
          </label>
        </div>
        <fieldset class="debug-name-grid" id="dbgNamesGrid">
          <legend>Player names</legend>
        </fieldset>
        <button id="dbgStartBtn" class="primary-button" type="button">Start game</button>
      </section>

      <!-- GAME PHASE -->
      <section id="debugGame" hidden>
        <div class="debug-turn-card card">
          <div id="dbgTurnLabel">—</div>
          <div class="debug-turn-controls">
            <label class="inline-label">
              Switch to:
              <select id="dbgCurrentPlayer"></select>
            </label>
            <button id="dbgRestartBtn" class="secondary-button" type="button">Restart</button>
          </div>
        </div>

        <section class="board-card" aria-label="Game board">
          <svg id="board" viewBox="0 0 420 455" role="img" aria-labelledby="boardTitle">
            <title id="boardTitle">Marbles board</title>
            <defs>
              <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1d2939" flood-opacity="0.16" />
              </filter>
              <linearGradient id="boardFill" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#f1d9aa" />
                <stop offset="100%" stop-color="#d9b572" />
              </linearGradient>
              <clipPath id="boardClip">
                <polygon id="boardClipShape" />
              </clipPath>
            </defs>
            <polygon id="boardShape" filter="url(#softShadow)" />
            <g id="woodLayer" clip-path="url(#boardClip)"></g>
            <g id="finishLayer"></g>
            <g id="trackLayer"></g>
            <g id="homeLayer"></g>
            <g id="tokenLayer"></g>
          </svg>
        </section>

        <section class="card debug-controls">
          <div class="debug-control-row">
            <label class="inline-label">
              Force die
              <input id="dbgForceDie" type="number" min="1" max="6" placeholder="random" inputmode="numeric" />
            </label>
            <button id="dbgRollBtn" class="primary-button" type="button">Roll</button>
            <button id="dbgEndTurnBtn" class="secondary-button" type="button">End turn</button>
          </div>
          <div id="dbgDieReadout" class="debug-die-readout">No roll yet.</div>

          <div class="debug-section-label">Available moves</div>
          <div id="dbgMovesPanel" class="moves"></div>

          <div class="debug-section-label">God mode</div>
          <p id="dbgGodHint" class="debug-god-hint">Click any marble on the board, then click a destination hole. Or use the buttons below for the selected marble.</p>
          <div id="dbgSelectionInfo" class="debug-selection">No marble selected.</div>
          <div class="debug-control-row">
            <button id="dbgSendHome" class="secondary-button" type="button" disabled>Send home</button>
            <button id="dbgSendCenter" class="secondary-button" type="button" disabled>Send to center</button>
            <label class="inline-label">
              Finish slot
              <select id="dbgFinishSlot" disabled>
                <option value="0">1</option>
                <option value="1">2</option>
                <option value="2">3</option>
                <option value="3">4</option>
              </select>
            </label>
            <button id="dbgSendFinish" class="secondary-button" type="button" disabled>Apply</button>
          </div>
        </section>

        <details class="game-details" id="dbgInfo">
          <summary>Game info</summary>
          <div id="dbgStatusPanel" class="status"></div>
        </details>
      </section>
    </main>

    <script type="module" src="debug.js?v=3"></script>
  </body>
</html>
